# Staging integration tests for @spec0/cli.
#
# Runs nightly (06:00 UTC) and on manual dispatch — exercises CLI commands
# end-to-end against the Spec0 staging platform as a smoke test. Tests live
# under `test/integration/` and share a harness (runCli.ts + staging-env.ts).
#
# ONE-TIME SETUP REQUIRED before this workflow can pass:
#   1. Create a `staging` Environment (Settings → Environments → New environment).
#   2. Add Environment **Variables** (not secrets):
#        - SPEC0_API_URL    (the staging platform's API host)
#        - SPEC0_ORG_ID     (UUID of the test org used by CI)
#        - SPEC0_SMOKE_TEAM (name of the pre-seeded team the SAT is scoped to;
#                            the lifecycle test pushes into it. Defaults to
#                            "cli-smoke" if unset.)
#   3. Add Environment **Secret**:
#        - SPEC0_SAT_PUBLIC  (Service Access Token with the scopes the
#          integration tests need — admin:team, read/write:apis,
#          read/write:specs, read/write:mocks)
#   Without these the scheduled/dispatched run still fires but
#   `npm run test:integration` skips every test (env-missing → describe.skip),
#   exits 0, and produces a green run that did nothing — which is also fine.

name: Staging Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # nightly 06:00 UTC
  # push:
  #   branches: [main]

concurrency:
  group: cli-staging-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: staging
    env:
      # CLI reads SPEC0_TOKEN; the repo secret is named SPEC0_SAT_PUBLIC for
      # consistency with the platform repo. Map it here.
      SPEC0_API_URL: ${{ vars.SPEC0_API_URL }}
      SPEC0_ORG_ID: ${{ vars.SPEC0_ORG_ID }}
      SPEC0_TOKEN: ${{ secrets.SPEC0_SAT_PUBLIC }}
      # The pre-seeded team the lifecycle test pushes into. Must match the team
      # the SAT is scoped to. Falls back to "cli-smoke" in the test if unset.
      SPEC0_SMOKE_TEAM: ${{ vars.SPEC0_SMOKE_TEAM }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Integration tests (live staging)
        run: npm run test:integration
